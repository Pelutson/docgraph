[project]
name = "docgraph"
version = "0.1.0"
description = "Local-first Wissens- und Dokumententool mit getrennter lokaler/Cloud-KI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "python-multipart>=0.0.9",  # für Datei-Uploads
    "httpx>=0.27",              # HTTP-Client für Ollama + Cloud-KI (+ TestClient)
    "pypdf>=5.0",               # PDF-Text extrahieren (Schritt 3)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["docgraph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
